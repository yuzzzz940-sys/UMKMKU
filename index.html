<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Kasir Digital</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;font-family:Poppins,Arial}
body{
margin:0;
background:linear-gradient(180deg,#12001f,#2a0045);
color:white;
}

.container{padding:15px;}

.box{
background:linear-gradient(180deg,#3a0a63,#2a0045);
border-radius:20px;
padding:15px;
margin-bottom:15px;
box-shadow:0 0 20px rgba(0,0,0,.3);
}

h1{overflow:hidden;white-space:nowrap}
.marquee{
display:inline-block;
animation:scrollText 8s linear infinite;
}
@keyframes scrollText{
0%{transform:translateX(100%)}
100%{transform:translateX(-100%)}
}

/* tombol tambah menu kecil */
.addMenuBtn{
position:absolute;
top:10px;
left:10px;
border:none;
border-radius:20px;
padding:4px 10px;
background:#c77dff;
color:black;
font-size:12px;
font-weight:bold;
}

/* menu area */
.menu-area{
height:40vh;
overflow-y:auto;
margin-top:10px;
}

.search{
width:100%;
padding:10px;
border-radius:10px;
border:none;
margin-bottom:10px;
}

.tab{display:flex;gap:10px;margin-bottom:10px;}
.tab button{
flex:1;
padding:8px;
border:none;
border-radius:15px;
background:#b87cff;
color:white;
font-weight:bold;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}
.item{
background:#4a197a;
border-radius:15px;
padding:10px;
text-align:center;
}
.item button{
margin-top:5px;
border:none;
border-radius:10px;
padding:5px;
background:#c77dff;
font-weight:bold;
}

input,select{
width:100%;
padding:10px;
border-radius:10px;
border:none;
margin-top:5px;
}
.btn{
margin-top:8px;
padding:10px;
border:none;
border-radius:15px;
font-weight:bold;
background:#c77dff;
}
.btn-blue{background:#3aa2ff}
.btn-green{background:#33d17a}

#addMenuPage{display:none}

/* PRINT STRUK */
@media print{
body *{visibility:hidden;}
#cartPage, #cartPage *{visibility:visible;}
#cartPage{position:absolute;left:0;top:0;width:100%;}
}
</style>
</head>

<body>
<div class="container">

<div id="menuPage" class="box" style="position:relative;">
<button class="addMenuBtn" onclick="openAddMenu()">+ Menu</button>

<h1><span class="marquee">Kasir Digital</span></h1>

<input type="text" class="search" id="search" placeholder="Cari menu..." onkeyup="renderMenu()">

<div class="tab">
<button onclick="showFood()">Makanan</button>
<button onclick="showDrink()">Minuman</button>
</div>

<div class="menu-area">
<div id="menuList" class="grid"></div>
</div>
</div>

<div class="box" id="cartPage">
<h2>Keranjang</h2>
<div id="cart"></div>
<h3>Total: Rp <span id="total">0</span></h3>

<input type="text" id="pay" placeholder="Nominal" oninput="formatPay(this)">
<button class="btn" onclick="hitung()">Hitung</button>

<h3>Kembalian: Rp <span id="change">0</span></h3>

<button class="btn-blue btn" onclick="printStruk()">Cetak Struk</button>
<button class="btn-green btn" onclick="reset()">Transaksi Baru</button>
</div>

<div id="addMenuPage" class="box">
<h2>Tambah Menu</h2>
<input type="text" id="newName" placeholder="Nama Menu">
<input type="number" id="newPrice" placeholder="Harga">
<select id="newType">
<option value="food">Makanan</option>
<option value="drink">Minuman</option>
</select>
<button class="btn" onclick="addMenu()">Simpan</button>
<button class="btn" onclick="closeAddMenu()">Kembali</button>
</div>

</div>

<script>
let menus=[
{name:"Steak Sapi",price:35000,type:"food"},
{name:"Fish & Chips",price:28000,type:"food"},
{name:"Chicken Katsu",price:24000,type:"food"},
{name:"Chicken Teriyaki",price:24000,type:"food"},
{name:"Chicken Blackpepper",price:24000,type:"food"},
{name:"Beef Blackpepper",price:30000,type:"food"},
{name:"Udang Crispy",price:26000,type:"food"},
{name:"Onion Ring",price:12000,type:"food"},
{name:"Nachos",price:15000,type:"food"},
{name:"Loaded Fries",price:18000,type:"food"},
{name:"Chicken Popcorn",price:17000,type:"food"},
{name:"Tortilla Wrap",price:19000,type:"food"},
{name:"Burger",price:20000,type:"food"},
{name:"Pizza",price:25000,type:"food"},
{name:"Hotdog",price:15000,type:"food"},
{name:"Kebab",price:17000,type:"food"},
{name:"Ramen",price:23000,type:"food"},
{name:"Takoyaki",price:14000,type:"food"},
{name:"Dimsum",price:13000,type:"food"},
{name:"Spaghetti",price:22000,type:"food"},
{name:"Lasagna",price:26000,type:"food"},
{name:"Chicken Wings",price:21000,type:"food"},
{name:"Sandwich",price:14000,type:"food"},
{name:"Risotto",price:27000,type:"food"},
{name:"BBQ Ribs",price:32000,type:"food"},
{name:"Tempura",price:16000,type:"food"},
{name:"Croquette",price:14000,type:"food"},
{name:"Nugget",price:12000,type:"food"},
{name:"French Toast",price:18000,type:"food"},
{name:"Quesadilla",price:22000,type:"food"},

{name:"Es Kopi",price:15000,type:"drink"},
{name:"Boba",price:18000,type:"drink"},
{name:"Thai Tea",price:14000,type:"drink"},
{name:"Matcha",price:17000,type:"drink"},
{name:"Milkshake",price:20000,type:"drink"},
{name:"Lemon Tea",price:10000,type:"drink"},
{name:"Americano",price:15000,type:"drink"},
{name:"Cappuccino",price:18000,type:"drink"},
{name:"Latte",price:19000,type:"drink"},
{name:"Smoothie",price:22000,type:"drink"},
{name:"Jus Alpukat",price:16000,type:"drink"},
{name:"Jus Mangga",price:15000,type:"drink"},
{name:"Jus Jeruk",price:14000,type:"drink"},
{name:"Jus Strawberry",price:17000,type:"drink"},
{name:"Yakult Float",price:15000,type:"drink"},
{name:"Soda Float",price:16000,type:"drink"},
{name:"Green Tea",price:13000,type:"drink"},
{name:"Red Velvet",price:20000,type:"drink"},
{name:"Choco Latte",price:18000,type:"drink"},
{name:"Ice Chocolate",price:19000,type:"drink"},
{name:"Ice Taro",price:18000,type:"drink"},
{name:"Ice Vanilla",price:17000,type:"drink"},
{name:"Ice Blueberry",price:19000,type:"drink"},
{name:"Ice Lychee",price:16000,type:"drink"},
{name:"Ice Peach",price:16000,type:"drink"},
{name:"Ice Melon",price:15000,type:"drink"},
{name:"Ice Banana",price:15000,type:"drink"},
{name:"Ice Durian",price:20000,type:"drink"},
{name:"Ice Coconut",price:14000,type:"drink"},
{name:"Ice Pandan",price:15000,type:"drink"}
];

let cart=[];
let currentType="food";

function format(n){return n.toLocaleString("id-ID");}

function renderMenu(){
let q=document.getElementById("search").value.toLowerCase();
let html="";
menus.filter(m=>m.type==currentType && m.name.toLowerCase().includes(q))
.forEach(m=>{
html+=`<div class="item">
<b>${m.name}</b><br>Rp ${format(m.price)}<br>
<button onclick="addCart('${m.name}',${m.price})">Tambah</button>
</div>`;
});
document.getElementById("menuList").innerHTML=html;
}

function showFood(){currentType="food";renderMenu();}
function showDrink(){currentType="drink";renderMenu();}

function addCart(n,p){
cart.push({name:n,price:p});
renderCart();
}

function renderCart(){
let html=""; let t=0;
cart.forEach(c=>{html+=`${c.name} - Rp ${format(c.price)}<br>`; t+=c.price;});
document.getElementById("cart").innerHTML=html;
document.getElementById("total").innerText=format(t);
}

function formatPay(el){
let v=el.value.replace(/\D/g,"");
el.value=v.replace(/\B(?=(\d{3})+(?!\d))/g,".");
}

function hitung(){
let pay=parseInt(document.getElementById("pay").value.replace(/\./g,""))||0;
let total=cart.reduce((a,b)=>a+b.price,0);
document.getElementById("change").innerText=format(pay-total);
}

function reset(){
cart=[];
renderCart();
document.getElementById("pay").value="";
document.getElementById("change").innerText=0;
}

function printStruk(){window.print();}

function openAddMenu(){
document.getElementById("menuPage").style.display="none";
document.getElementById("cartPage").style.display="none";
document.getElementById("addMenuPage").style.display="block";
}

function closeAddMenu(){
document.getElementById("menuPage").style.display="block";
document.getElementById("cartPage").style.display="block";
document.getElementById("addMenuPage").style.display="none";
}

function addMenu(){
let n=document.getElementById("newName").value;
let p=parseInt(document.getElementById("newPrice").value);
let t=document.getElementById("newType").value;
if(n && p){
menus.push({name:n,price:p,type:t});
closeAddMenu();
renderMenu();
}
}

renderMenu();
</script>
</body>
</html>
